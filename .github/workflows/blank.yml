- name: Unzip and Commit
  run: |
    filename=$(basename -s .zip *.zip)
    unzip -o "$filename.zip"   # -o 表示覆盖，不询问
    rm "$filename.zip"
    git config user.name "github-actions"
    git config user.email "github-actions@github.com"
    git add .
    git commit -m "Auto unzip $filename.zip" || echo "No changes to commit"
    git push
